<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>最小多人 Survivors · 同步示意</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="brand">MIN CO-OP SURVIVORS</div>
        <div class="stat">你 HP <b id="hp">100</b></div>
        <div class="stat">隊友 HP <b id="ally">100</b></div>
        <div class="stat">殺敵 <b id="kills">0</b></div>
        <div class="stat muted">WASD 移動 · 假隊友同步助攻</div>
      </header>
      <canvas id="game" width="960" height="540" aria-label="多人 Survivors 畫布"></canvas>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">單機殼 + mock 隊友位置同步</span>
      </footer>
    </div>
    <script src="./game.js"></script>
  </body>
</html>
