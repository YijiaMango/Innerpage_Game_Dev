<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Breakout · 打磚塊</title>
    <link rel="stylesheet" href="./style.css?v=20260311b" />
    <link rel="stylesheet" href="../mobile-pad.css?v=20260311b" />
  </head>
  <body data-pad="lr-serve">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN BREAKOUT</div>
        <div class="stat">分數 <b id="score">0</b></div>
        <div class="stat">命 <b id="lives">3</b></div>
        <div class="stat muted">拖曳底板 · 點一下發球</div>
      </header>
      <div class="stage"><canvas id="game" width="540" height="960" aria-label="打磚塊畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">清光磚塊</span>
      </footer>
    </div>
    <script src="../pad-input.js?v=20260311b"></script>
    <script src="../feel.js?v=20260311b"></script>
    <script src="./game.js?v=20260311b"></script>
    <script src="../fit-canvas.js?v=20260311b"></script>
    <script src="../mobile-pad.js?v=20260311b"></script>

  </body>
</html>
