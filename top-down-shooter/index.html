<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Top-down Shooter · 俯視射擊</title>
    <link rel="stylesheet" href="./style.css?v=20260311b" />
    <link rel="stylesheet" href="../mobile-pad.css?v=20260311b" />
  </head>
  <body data-pad="move-fire">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN TDS</div>
        <div class="stat">HP <b id="hp">100</b></div>
        <div class="stat">殺敵 <b id="kills">0</b></div>
        <div class="stat muted">拖曳移動 · 右側點擊射擊</div>
      </header>
      <div class="stage"><canvas id="game" width="540" height="960" aria-label="俯視射擊畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">手動瞄準，不是自動鎖定</span>
      </footer>
    </div>
    <script src="../pad-input.js?v=20260311b"></script>
    <script src="../feel.js?v=20260311b"></script>
    <script src="./game.js?v=20260311b"></script>
    <script src="../fit-canvas.js?v=20260311b"></script>
    <script src="../mobile-pad.js?v=20260311b"></script>

  </body>
</html>
