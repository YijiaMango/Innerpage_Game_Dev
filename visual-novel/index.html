<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Visual Novel · 視覺小說</title>
    <link rel="stylesheet" href="../controls.css?v=20260311e" />
<link rel="stylesheet" href="./style.css?v=20260311e" />
  </head>
  <body data-pad="none">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN VN</div>
        <div class="stat muted">腳本驅動對話 · 分支選項</div>
      </header>
      <div class="stage" id="stage">
        <div class="bg" id="bg"></div>
        <div class="speaker" id="speaker"></div>
        <div class="textbox" id="textbox" tabindex="0">
          <p id="line"></p>
          <div class="choices hidden" id="choices"></div>
          <div class="hint" id="hint">點擊／空白鍵繼續</div>
        </div>
      </div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">從頭</button>
        <span id="status" class="status">最小劇情殼</span>
      </footer>
    </div>

    <script src="../controls.js?v=20260311e"></script>
    <script src="../feel.js?v=20260311e"></script>
    <script src="./game.js?v=20260311e"></script>
  </body>
</html>
