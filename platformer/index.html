<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Platformer · 平台跳躍</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../mobile-pad.css" />
  </head>
  <body data-pad="move-jump">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN PLATFORMER</div>
        <div class="stat">硬幣 <b id="coins">0</b></div>
        <div class="stat muted" id="hint">←→ 移動 · Space／↑ 跳 · 碰到旗幟通關</div>
      </header>
      <div class="stage"><canvas id="game" width="960" height="540" aria-label="平台遊戲畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">到達右側旗幟</span>
      </footer>
    </div>
    <script src="../pad-input.js"></script>
    <script src="../feel.js"></script>
    <script src="./game.js"></script>
    <script src="../fit-canvas.js"></script>
    <script src="../mobile-pad.js"></script>

  </body>
</html>
