<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Shmup · 縱向射擊</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../mobile-pad.css" />
  </head>
  <body data-pad="lr">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN SHMUP</div>
        <div class="stat">分數 <b id="score">0</b></div>
        <div class="stat">HP <b id="hp">5</b></div>
        <div class="stat muted">←→／AD 移動 · 自動開火</div>
      </header>
      <div class="stage"><canvas id="game" width="540" height="960" aria-label="射擊畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">躲开子彈、打爆敵機</span>
      </footer>
    </div>
    <script src="../pad-input.js"></script>
    <script src="../feel.js"></script>
    <script src="./game.js"></script>
    <script src="../fit-canvas.js"></script>
    <script src="../mobile-pad.js"></script>

  </body>
</html>
