<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Tactics · 戰棋</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-pad="none">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN TACTICS</div>
        <div class="stat">回合 <b id="turn">你</b></div>
        <div class="stat muted">點己方 → 移動／攻擊相鄰敵</div>
      </header>
      <div class="stage"><canvas id="game" width="540" height="960" aria-label="戰棋畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-end" class="primary">結束己方回合</button>
        <button type="button" id="btn-restart">重來</button>
        <span id="status" class="status">全滅敵方</span>
      </footer>
    </div>
    <script src="../pad-input.js"></script>
    <script src="../feel.js"></script>
    <script src="./game.js"></script>
    <script src="../fit-canvas.js"></script>

  </body>
</html>
