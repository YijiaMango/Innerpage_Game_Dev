<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Merge · 合成</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-pad="none">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN MERGE</div>
        <div class="stat">最高階 <b id="max">1</b></div>
        <div class="stat">分數 <b id="score">0</b></div>
        <div class="stat muted">點空位放下 · 同階相鄰會合成</div>
      </header>
      <div class="stage"><canvas id="game" width="480" height="480" aria-label="合成畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">下一顆：<b id="next">1</b></span>
      </footer>
    </div>
    <script src="../pad-input.js"></script>
    <script src="../feel.js"></script>
    <script src="./game.js"></script>
    <script src="../fit-canvas.js"></script>

  </body>
</html>
