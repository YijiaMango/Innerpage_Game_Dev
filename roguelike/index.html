<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Roguelike · 地城</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../mobile-pad.css" />
  </head>
  <body data-pad="swipe">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN ROGUELIKE</div>
        <div class="stat">HP <b id="hp">30</b></div>
        <div class="stat">樓層 <b id="floor">1</b></div>
        <div class="stat">金幣 <b id="gold">0</b></div>
        <div class="stat muted">方向鍵／WASD 移動 · 撞怪攻擊 · 找樓梯</div>
      </header>
      <div class="stage"><canvas id="game" width="540" height="960" aria-label="地城畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">探索並下樓</span>
      </footer>
    </div>
    <script src="../pad-input.js"></script>
    <script src="../feel.js"></script>
    <script src="./game.js"></script>
    <script src="../fit-canvas.js"></script>
    <script src="../mobile-pad.js"></script>

  </body>
</html>
