<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Falling Blocks · 方塊下落</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="brand">MIN BLOCKS</div>
        <div class="stat">分數 <b id="score">0</b></div>
        <div class="stat">消行 <b id="lines">0</b></div>
        <div class="stat muted">←→ 移 · ↑ 轉 · ↓ 快降 · Space 硬降</div>
      </header>
      <div class="stage"><canvas id="game" width="300" height="600" aria-label="方塊畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">清行得分</span>
      </footer>
    </div>
    <script src="../feel.js"></script>
    <script src="./game.js"></script>
    <script src="../fit-canvas.js"></script>

  </body>
</html>
