<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Falling Blocks · 方塊下落</title>
    <link rel="stylesheet" href="../controls.css?v=20260311e" />
<link rel="stylesheet" href="./style.css?v=20260311e" />
</head>
  <body data-pad="tetris">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN BLOCKS</div>
        <div class="stat">分數 <b id="score">0</b></div>
        <div class="stat">消行 <b id="lines">0</b></div>
        <div class="stat muted">左右滑移 · 點一下旋轉 · 下滑加速／硬降</div>
      </header>
      <div class="stage"><canvas id="game" width="540" height="960" aria-label="方塊畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">清行得分</span>
      </footer>
    </div>

    <script src="../controls.js?v=20260311e"></script>
    <script src="../feel.js?v=20260311e"></script>
    <script src="./game.js?v=20260311e"></script>
    <script src="../fit-canvas.js?v=20260311e"></script>
  </body>
</html>
