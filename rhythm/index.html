<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Rhythm · 節奏</title>
    <link rel="stylesheet" href="../controls.css?v=20260311e" />
<link rel="stylesheet" href="./style.css?v=20260311e" />
</head>
  <body data-pad="lanes">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN RHYTHM</div>
        <div class="stat">分數 <b id="score">0</b></div>

      <div class="stage"><canvas id="game" width="540" height="960" aria-label="節奏畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">D F J K</span>
      </footer>
    </div>

    <script src="../controls.js?v=20260311e"></script>
    <script src="../feel.js?v=20260311e"></script>
