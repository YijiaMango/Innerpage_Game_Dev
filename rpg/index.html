<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 RPG · 傳統 RPG 殼</title>
    <link rel="stylesheet" href="../controls.css?v=20260311e" />
<link rel="stylesheet" href="./style.css?v=20260311e" />
</head>
  <body data-pad="move-act">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN RPG</div>
        <div class="stat">HP <b id="hp">40</b></div>
        <div class="stat">金幣 <b id="gold">0</b></div>
        <div class="stat muted">拖曳移動 · 點一下互動</div>
      </header>
      <div class="stage"><canvas id="game" width="540" height="960" aria-label="RPG 畫布"></canvas></div>
      <div id="panel" class="panel hidden">
        <div id="panel-body"></div>
        <div id="panel-actions" class="panel-actions"></div>
      </div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來</button>
        <span id="status" class="status">找村民對話，打史萊姆練等</span>
      </footer>
    </div>

    <script src="../controls.js?v=20260311e"></script>
    <script src="../feel.js?v=20260311e"></script>
    <script src="./game.js?v=20260311e"></script>
    <script src="../fit-canvas.js?v=20260311e"></script>
  </body>
</html>
