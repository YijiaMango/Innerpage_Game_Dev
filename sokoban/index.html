<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>最小 Sokoban · 推箱子</title>
    <link rel="stylesheet" href="../controls.css?v=20260311e" />
<link rel="stylesheet" href="./style.css?v=20260311e" />
</head>
  <body data-pad="swipe">
    <div id="app">
      <header class="hud">
        <div class="brand">MIN SOKOBAN</div>
        <div class="stat">關卡 <b id="level">1</b></div>
        <div class="stat">步數 <b id="steps">0</b></div>
        <div class="stat muted">滑動推箱 · 箱子推到目標點</div>
      </header>
      <div class="stage"><canvas id="game" width="540" height="960" aria-label="推箱子畫布"></canvas></div>
      <footer class="bar">
        <button type="button" id="btn-restart" class="primary">重來本關</button>
        <span id="status" class="status">把所有箱子推到 ·</span>
      </footer>
    </div>

    <script src="../controls.js?v=20260311e"></script>
    <script src="../feel.js?v=20260311e"></script>
    <script src="./game.js?v=20260311e"></script>
    <script src="../fit-canvas.js?v=20260311e"></script>
  </body>
</html>
